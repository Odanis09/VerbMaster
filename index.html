<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VerbMaster – Aprende Verbos en Inglés</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f1a;
    --surface: #131929;
    --card: #1a2236;
    --border: #243050;
    --accent: #4fffb0;
    --accent2: #7b6cff;
    --accent3: #ff6c8a;
    --text: #e8edf8;
    --muted: #7a8aaa;
    --radius: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #0e1526 0%, #151e35 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 32px 20px;
    position: sticky; top:0; z-index:100;
    backdrop-filter: blur(12px);
  }
  .header-inner { max-width:1200px; margin:auto; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .logo { font-family:'Syne',sans-serif; font-size:1.6rem; font-weight:800; letter-spacing:-0.5px; }
  .logo span { color: var(--accent); }
  .tabs { display:flex; gap:8px; margin-left:auto; flex-wrap:wrap; }
  .tab-btn {
    padding:8px 20px; border-radius:40px; border:1.5px solid var(--border);
    background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif;
    font-size:.875rem; font-weight:500; cursor:pointer; transition:all .2s;
  }
  .tab-btn.active, .tab-btn:hover {
    background: var(--accent); border-color: var(--accent);
    color: #0b0f1a; font-weight:700;
  }
  .tab-btn.tab-irreg.active { background:var(--accent2); border-color:var(--accent2); color:#fff; }
  .tab-btn.tab-quiz.active  { background:var(--accent3); border-color:var(--accent3); color:#fff; }

  /* ── SEARCH & FILTERS ── */
  .toolbar {
    max-width:1200px; margin:28px auto 0; padding:0 32px;
    display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  }
  .search-wrap { position:relative; flex:1; min-width:220px; }
  .search-wrap svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.4; pointer-events:none; }
  .search-input {
    width:100%; background:var(--card); border:1.5px solid var(--border);
    border-radius:40px; padding:11px 18px 11px 44px; color:var(--text);
    font-family:'DM Sans',sans-serif; font-size:.9rem; outline:none; transition:border .2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }
  .filter-select {
    background:var(--card); border:1.5px solid var(--border); border-radius:40px;
    padding:11px 18px; color:var(--text); font-family:'DM Sans',sans-serif;
    font-size:.9rem; outline:none; cursor:pointer;
  }
  .count-badge {
    background:var(--surface); border:1px solid var(--border); border-radius:40px;
    padding:8px 16px; font-size:.8rem; color:var(--muted); white-space:nowrap;
  }
  .count-badge b { color:var(--accent); }

  /* ── VERB GRID ── */
  .grid-section { max-width:1200px; margin:28px auto 60px; padding:0 32px; }
  .verb-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap:18px;
  }

  /* ── VERB CARD ── */
  .verb-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    cursor:pointer;
    transition: transform .18s, border-color .18s, box-shadow .18s;
    position:relative; overflow:hidden;
  }
  .verb-card::before {
    content:''; position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(79,255,176,.05) 0%, transparent 60%);
    opacity:0; transition:opacity .2s;
  }
  .verb-card:hover { transform:translateY(-3px); border-color:var(--accent); box-shadow:0 8px 32px rgba(79,255,176,.1); }
  .verb-card:hover::before { opacity:1; }
  .verb-card.irreg { border-left:3px solid var(--accent2); }
  .verb-card.reg   { border-left:3px solid var(--accent); }

  .verb-badge {
    display:inline-block; font-size:.7rem; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; padding:3px 10px; border-radius:20px; margin-bottom:12px;
  }
  .verb-badge.irreg { background:rgba(123,108,255,.18); color:var(--accent2); }
  .verb-badge.reg   { background:rgba(79,255,176,.12); color:var(--accent); }

  .verb-infinitive {
    font-family:'Syne',sans-serif; font-size:1.5rem; font-weight:800; letter-spacing:-0.5px;
    display:flex; align-items:center; gap:10px; margin-bottom:4px;
  }
  .verb-spanish {
    font-size:.9rem; color:var(--muted); margin-bottom:16px;
  }
  .forms-row {
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:16px;
  }
  .form-box {
    background:var(--surface); border-radius:10px; padding:10px 10px 8px;
    border:1px solid var(--border);
  }
  .form-label { font-size:.65rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:4px; }
  .form-value { font-size:.85rem; font-weight:500; color:var(--text); }

  .card-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn-sm {
    flex:1; min-width:90px; padding:8px 12px; border-radius:10px; border:1.5px solid var(--border);
    background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif;
    font-size:.78rem; font-weight:500; cursor:pointer; transition:all .18s;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .btn-sm.listen { border-color:rgba(79,255,176,.4); color:var(--accent); }
  .btn-sm.listen:hover { background:rgba(79,255,176,.12); }
  .btn-sm.example { border-color:rgba(255,108,138,.35); color:var(--accent3); }
  .btn-sm.example:hover { background:rgba(255,108,138,.1); }

  /* ── SOUND indicator ── */
  .speaking .verb-infinitive::after {
    content:''; display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--accent); animation:pulse .6s infinite alternate;
  }
  @keyframes pulse { from{opacity:.3} to{opacity:1} }

  /* ── MODAL ── */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal {
    background: var(--card); border:1.5px solid var(--border); border-radius:24px;
    padding:36px; max-width:540px; width:100%; max-height:90vh; overflow-y:auto;
    transform:translateY(20px); transition:transform .25s;
    scrollbar-width:thin; scrollbar-color: var(--border) transparent;
  }
  .modal-overlay.open .modal { transform:translateY(0); }
  .modal-close {
    float:right; background:var(--surface); border:1px solid var(--border);
    color:var(--muted); width:36px; height:36px; border-radius:50%; cursor:pointer;
    font-size:1.1rem; display:flex; align-items:center; justify-content:center;
  }
  .modal-title { font-family:'Syne',sans-serif; font-size:2rem; font-weight:800; margin-bottom:6px; }
  .modal-spanish { color:var(--muted); font-size:1rem; margin-bottom:24px; }
  .modal-forms {
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:24px;
  }
  .modal-form-box {
    background:var(--surface); border-radius:12px; padding:14px;
    border:1px solid var(--border); text-align:center;
  }
  .modal-form-label { font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px; }
  .modal-form-value { font-size:1rem; font-weight:700; }
  .modal-form-box.inf .modal-form-value  { color:var(--accent); }
  .modal-form-box.past .modal-form-value { color:var(--accent2); }
  .modal-form-box.pp .modal-form-value   { color:var(--accent3); }
  .modal-section-title {
    font-size:.75rem; text-transform:uppercase; letter-spacing:.1em;
    color:var(--muted); margin:20px 0 12px; font-weight:600;
  }
  .sentence-list { display:flex; flex-direction:column; gap:10px; }
  .sentence-item {
    background:var(--surface); border-radius:10px; padding:14px 16px;
    border-left:3px solid var(--accent2); line-height:1.6;
  }
  .sentence-item .eng { font-size:.95rem; margin-bottom:4px; }
  .sentence-item .esp { font-size:.83rem; color:var(--muted); }
  .modal-listen-btn {
    width:100%; padding:14px; border-radius:12px; margin-top:20px;
    background:rgba(79,255,176,.1); border:1.5px solid rgba(79,255,176,.35);
    color:var(--accent); font-family:'DM Sans',sans-serif; font-size:.95rem;
    font-weight:600; cursor:pointer; transition:all .2s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .modal-listen-btn:hover { background:rgba(79,255,176,.2); }

  /* ── QUIZ MODE ── */
  #quiz-section { max-width:680px; margin:40px auto 60px; padding:0 32px; }
  .quiz-card {
    background:var(--card); border:1.5px solid var(--border); border-radius:24px;
    padding:40px; text-align:center;
  }
  .quiz-progress-bar {
    height:4px; background:var(--border); border-radius:4px; margin-bottom:32px; overflow:hidden;
  }
  .quiz-progress-fill { height:100%; background:var(--accent3); border-radius:4px; transition:width .4s; }
  .quiz-question-label { font-size:.75rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:12px; }
  .quiz-verb { font-family:'Syne',sans-serif; font-size:2.8rem; font-weight:800; margin-bottom:8px; letter-spacing:-1px; }
  .quiz-hint { color:var(--muted); font-size:.95rem; margin-bottom:32px; }
  .quiz-options { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
  .quiz-option {
    background:var(--surface); border:2px solid var(--border); border-radius:14px;
    padding:16px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.95rem;
    color:var(--text); transition:all .18s; font-weight:500;
  }
  .quiz-option:hover { border-color:var(--accent2); background:rgba(123,108,255,.1); }
  .quiz-option.correct { border-color:var(--accent)!important; background:rgba(79,255,176,.12)!important; color:var(--accent); }
  .quiz-option.wrong   { border-color:var(--accent3)!important; background:rgba(255,108,138,.1)!important; color:var(--accent3); }
  .quiz-score { font-size:.9rem; color:var(--muted); }
  .quiz-score b { color:var(--accent); font-size:1.1rem; }
  .quiz-next-btn {
    padding:14px 32px; border-radius:40px; background:var(--accent2);
    border:none; color:#fff; font-family:'DM Sans',sans-serif; font-size:.95rem;
    font-weight:700; cursor:pointer; transition:all .2s; margin-top:8px;
  }
  .quiz-next-btn:hover { opacity:.85; }
  .quiz-result {
    background:var(--surface); border-radius:14px; padding:24px; margin-top:20px;
  }
  .quiz-result p { font-size:.9rem; color:var(--muted); margin-bottom:6px; }
  .quiz-result .big { font-family:'Syne',sans-serif; font-size:3rem; font-weight:800; color:var(--accent); }

  /* ── EMPTY ── */
  .empty { text-align:center; padding:60px 20px; color:var(--muted); }
  .empty .icon { font-size:3rem; margin-bottom:12px; }

  /* ── RESPONSIVE ── */
  @media(max-width:640px){
    header { padding:18px 20px 14px; }
    .toolbar, .grid-section, #quiz-section { padding:0 16px; }
    .modal { padding:24px; }
    .quiz-card { padding:28px 20px; }
    .quiz-options { grid-template-columns:1fr; }
    .modal-forms, .forms-row { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Verb<span>Master</span></div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('all')">📚 All Verbs</button>
      <button class="tab-btn tab-irreg" onclick="switchTab('irregular')">⚡ Irregular</button>
      <button class="tab-btn" onclick="switchTab('regular')">✅ Regular</button>
      <button class="tab-btn tab-quiz" onclick="switchTab('quiz')">🎯 Quiz</button>
    </div>
  </div>
</header>

<div id="main-section">
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" id="searchInput" type="text" placeholder="Search verb... (e.g. run, go, work)" oninput="renderVerbs()">
    </div>
    <select class="filter-select" id="soundFilter" onchange="renderVerbs()">
      <option value="">All sounds</option>
      <option value="/id/">Sound /id/</option>
      <option value="/t/">Sound /t/</option>
      <option value="/d/">Sound /d/</option>
    </select>
    <div class="count-badge">Showing <b id="countDisplay">0</b> verbs</div>
  </div>

  <div class="grid-section">
    <div class="verb-grid" id="verbGrid"></div>
    <div class="empty" id="emptyState" style="display:none">
      <div class="icon">🔍</div>
      <p>No verbs found matching your search.</p>
    </div>
  </div>
</div>

<div id="quiz-section" style="display:none">
  <div class="quiz-card" id="quizCard"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal"></div>
</div>

  "Follow":   [{eng:"Follow the instructions carefully.",esp:"Sigue las instrucciones con cuidado."},{eng:"She followed the recipe step by step.",esp:"Ella siguió la receta paso a paso."},{eng:"He has followed that team for years.",esp:"Él ha seguido a ese equipo por años."}],
  "Hurry":    [{eng:"Hurry up or we'll be late.",esp:"Date prisa o llegaremos tarde."},{eng:"She hurried to catch the bus.",esp:"Ella se apresuró para tomar el autobús."},{eng:"We have hurried all day.",esp:"Hemos tenido prisa todo el día."}],
  "Open":     [{eng:"Open the door for our guests.",esp:"Abre la puerta para nuestros invitados."},{eng:"She opened a new savings account.",esp:"Ella abrió una nueva cuenta de ahorros."},{eng:"He has opened his own restaurant.",esp:"Él ha abierto su propio restaurante."}],
  "Order":    [{eng:"I always order the same dish.",esp:"Siempre pido el mismo plato."},{eng:"She ordered pizza for everyone.",esp:"Ella pidió pizza para todos."},{eng:"He has ordered new furniture.",esp:"Él ha pedido muebles nuevos."}],
  "Plan":     [{eng:"I plan everything in advance.",esp:"Planifico todo con anticipación."},{eng:"She planned a surprise party.",esp:"Ella planeó una fiesta sorpresa."},{eng:"We have planned this trip for months.",esp:"Hemos planeado este viaje por meses."}],
  "Rain":     [{eng:"It rains a lot in spring.",esp:"Llueve mucho en primavera."},{eng:"It rained all day yesterday.",esp:"Llovió todo el día ayer."},{eng:"It has rained for three days straight.",esp:"Ha llovido tres días seguidos."}],
  "Remember": [{eng:"I remember my first day of school.",esp:"Recuerdo mi primer día de escuela."},{eng:"She remembered to buy milk.",esp:"Ella recordó comprar leche."},{eng:"He has remembered every detail.",esp:"Él ha recordado cada detalle."}],
  "Stay":     [{eng:"Please stay with me.",esp:"Por favor quédate conmigo."},{eng:"She stayed at a nice hotel.",esp:"Ella se quedó en un buen hotel."},{eng:"They have stayed friends all these years.",esp:"Han permanecido amigos todos estos años."}],
  "Turn":     [{eng:"Turn left at the next corner.",esp:"Dobla a la izquierda en la próxima esquina."},{eng:"She turned off the lights.",esp:"Ella apagó las luces."},{eng:"The caterpillar has turned into a butterfly.",esp:"La oruga se ha convertido en mariposa."}],
  "Try":      [{eng:"Always try your best.",esp:"Siempre haz tu mejor esfuerzo."},{eng:"She tried the new restaurant downtown.",esp:"Ella probó el nuevo restaurante del centro."},{eng:"We have tried everything possible.",esp:"Hemos intentado todo lo posible."}],
  "Practice": [{eng:"Practice makes perfect.",esp:"La práctica hace al maestro."},{eng:"She practiced the piano every day.",esp:"Ella practicó el piano todos los días."},{eng:"He has practiced for months.",esp:"Él ha practicado durante meses."}],
  "Dance":    [{eng:"I dance salsa on weekends.",esp:"Bailo salsa los fines de semana."},{eng:"They danced all night.",esp:"Ellos bailaron toda la noche."},{eng:"She has danced since she was a child.",esp:"Ella ha bailado desde niña."}],
  "Ask":      [{eng:"Don't be afraid to ask questions.",esp:"No tengas miedo de hacer preguntas."},{eng:"She asked for directions.",esp:"Ella preguntó cómo llegar."},{eng:"He has asked for her hand in marriage.",esp:"Él le ha pedido matrimonio."}],
};

function getSentences(v) {
  return EXAMPLES[v.inf] || EXAMPLES_EXTRA[v.inf] || [
    {eng:`I ${v.inf.toLowerCase()} regularly.`, esp:`Yo ${v.es.toLowerCase()} regularmente.`},
    {eng:`She ${v.past.toLowerCase()} yesterday.`, esp:`Ella ${v.es.toLowerCase()} ayer.`},
    {eng:`We have ${v.pp.toLowerCase()} before.`, esp:`Nosotros hemos ${v.es.toLowerCase()} antes.`}
  ];
}

// ── STATE ─────────────────────────────────────────────────────────────────
let currentTab = 'all';
let quizState  = {};

// ── RENDER VERBS ──────────────────────────────────────────────────────────
function getFilteredVerbs() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const sf = document.getElementById('soundFilter').value;
  let verbs = [];
  if (currentTab !== 'irregular') {
    REGULAR.forEach(v => {
      if (sf && v.sound !== sf) return;
      if (q && !v.inf.toLowerCase().includes(q) && !v.es.toLowerCase().includes(q)) return;
      verbs.push({...v, type:'regular'});
    });
  }
  if (currentTab !== 'regular') {
    if (!sf) {
      IRREGULAR.forEach(v => {
        if (q && !v.inf.toLowerCase().includes(q) && !v.es.toLowerCase().includes(q)) return;
        verbs.push({...v, type:'irregular'});
      });
    }
  }
  verbs.sort((a,b)=>a.inf.localeCompare(b.inf));
  return verbs;
}

function renderVerbs() {
  const verbs = getFilteredVerbs();
  const grid  = document.getElementById('verbGrid');
  const empty = document.getElementById('emptyState');
  document.getElementById('countDisplay').textContent = verbs.length;
  if (!verbs.length) { grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  grid.innerHTML = verbs.map((v,i) => `
    <div class="verb-card ${v.type}" onclick="openModal('${v.inf}')" style="animation-delay:${i*15}ms">
      <span class="verb-badge ${v.type}">${v.type==='irregular'?'Irregular':'Regular'}${v.sound?' · '+v.sound:''}</span>
      <div class="verb-infinitive">${v.inf}</div>
      <div class="verb-spanish"><span style="font-style:normal">🇪🇸</span> ${v.es}</div>
      <div class="forms-row">
        <div class="form-box">
          <div class="form-label">Infinitive</div>
          <div class="form-value">${v.inf}</div>
        </div>
        <div class="form-box">
          <div class="form-label">Simple Past</div>
          <div class="form-value">${v.past}</div>
        </div>
        <div class="form-box">
          <div class="form-label">Past Participle</div>
          <div class="form-value">${v.pp}</div>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn-sm listen" onclick="event.stopPropagation();speak('${v.inf}')">🔊 Listen</button>
        <button class="btn-sm example" onclick="event.stopPropagation();openModal('${v.inf}')">📖 Examples</button>
      </div>
    </div>
  `).join('');
}

// ── TTS ───────────────────────────────────────────────────────────────────
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

// ── MODAL ─────────────────────────────────────────────────────────────────
function openModal(inf) {
  const allVerbs = [...IRREGULAR.map(v=>({...v,type:'irregular'})), ...REGULAR.map(v=>({...v,type:'regular'}))];
  const v = allVerbs.find(x=>x.inf===inf);
  if (!v) return;
  const sentences = getSentences(v);
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div style="clear:both"></div>
    <span class="verb-badge ${v.type}" style="margin-bottom:14px;display:inline-block">${v.type==='irregular'?'Irregular':'Regular'}${v.sound?` · ${v.sound}`:''}</span>
    <div class="modal-title">${v.inf}</div>
    <div class="modal-spanish"><span style="font-style:normal">🇪🇸</span> ${v.es}</div>
    <div class="modal-forms">
      <div class="modal-form-box inf">
        <div class="modal-form-label">Infinitive</div>
        <div class="modal-form-value">${v.inf}</div>
      </div>
      <div class="modal-form-box past">
        <div class="modal-form-label">Simple Past</div>
        <div class="modal-form-value">${v.past}</div>
      </div>
      <div class="modal-form-box pp">
        <div class="modal-form-label">Past Participle</div>
        <div class="modal-form-value">${v.pp}</div>
      </div>
    </div>
    <div class="modal-section-title">🎧 Pronunciation</div>
    <button class="modal-listen-btn" onclick="speak('${v.inf}')">🔊 Listen: <b>${v.inf}</b> (Infinitive)</button>
    <button class="modal-listen-btn" style="margin-top:8px;background:rgba(123,108,255,.1);border-color:rgba(123,108,255,.35);color:var(--accent2)" onclick="speak('${v.past}')">🔊 Listen: <b>${v.past}</b> (Simple Past)</button>
    <button class="modal-listen-btn" style="margin-top:8px;background:rgba(255,108,138,.08);border-color:rgba(255,108,138,.35);color:var(--accent3)" onclick="speak('${v.pp}')">🔊 Listen: <b>${v.pp}</b> (Past Participle)</button>
    <div class="modal-section-title">📖 Example sentences</div>
    <div class="sentence-list">
      ${sentences.map(s=>`
        <div class="sentence-item" onclick="speak('${s.eng.replace(/'/g,"\\'")}')">
          <div class="eng">${s.eng}</div>
          <div class="esp">🇪🇸 ${s.esp}</div>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target===document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
  }
}

// ── QUIZ ──────────────────────────────────────────────────────────────────
function startQuiz() {
  const pool = [...IRREGULAR, ...REGULAR.map(v=>({...v}))];
  const shuffled = pool.sort(()=>Math.random()-.5).slice(0,20);
  quizState = { verbs: shuffled, index:0, score:0, answered:false };
  renderQuiz();
}

function renderQuiz() {
  const qs = quizState;
  if (qs.index >= qs.verbs.length) { renderQuizResult(); return; }
  const v = qs.verbs[qs.index];
  const modes = ['past','pp'];
  const mode = modes[Math.floor(Math.random()*2)];
  qs.currentMode = mode;
  qs.currentVerb = v;
  const label = mode==='past' ? 'Simple Past' : 'Past Participle';
  const correct = mode==='past' ? v.past : v.pp;
  // wrong options
  const allVerbs = [...IRREGULAR,...REGULAR];
  const wrongs = allVerbs.filter(x=>x!==v)
    .sort(()=>Math.random()-.5).slice(0,3)
    .map(x=> mode==='past'?x.past:x.pp);
  const opts = [...wrongs, correct].sort(()=>Math.random()-.5);
  const pct = ((qs.index)/qs.verbs.length*100).toFixed(0);

  document.getElementById('quizCard').innerHTML = `
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
    <div class="quiz-question-label">Question ${qs.index+1} of ${qs.verbs.length}</div>
    <div class="quiz-verb">${v.inf}</div>
    <div class="quiz-hint">What is the <b>${label}</b> of this verb?</div>
    <div class="quiz-options" id="quizOpts">
      ${opts.map(o=>`<button class="quiz-option" onclick="checkAnswer('${o.replace(/'/g,"\\'")}','${correct.replace(/'/g,"\\'")}',this)">${o}</button>`).join('')}
    </div>
    <div class="quiz-score">Score: <b>${qs.score}</b> / ${qs.index}</div>
  `;
}

function checkAnswer(chosen, correct, btn) {
  if (quizState.answered) return;
  quizState.answered = true;
  const opts = document.querySelectorAll('.quiz-option');
  opts.forEach(b => {
    if (b.textContent.trim()===correct) b.classList.add('correct');
    else if (b===btn) b.classList.add('wrong');
    b.style.pointerEvents='none';
  });
  if (chosen===correct) quizState.score++;
  setTimeout(()=>{ quizState.index++; quizState.answered=false; renderQuiz(); },1200);
}

function renderQuizResult() {
  const {score, verbs} = quizState;
  const pct = Math.round(score/verbs.length*100);
  const emoji = pct>=80?'🏆':pct>=50?'👍':'📚';
  document.getElementById('quizCard').innerHTML = `
    <div style="font-size:3rem;margin-bottom:16px">${emoji}</div>
    <div style="font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;margin-bottom:8px">Quiz Complete!</div>
    <div class="quiz-result">
      <p>Your final score</p>
      <div class="big">${score}/${verbs.length}</div>
      <p style="margin-top:8px">${pct}% correct</p>
    </div>
    <button class="quiz-next-btn" style="margin-top:24px" onclick="startQuiz()">🔄 Try Again</button>
  `;
}

// ── TAB SWITCH ────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  const isQuiz = tab==='quiz';
  document.getElementById('main-section').style.display = isQuiz?'none':'block';
  document.getElementById('quiz-section').style.display  = isQuiz?'block':'none';
  document.getElementById('soundFilter').style.display   = (tab==='irregular'||tab==='all'&&false)?'none':'';
  if (isQuiz) startQuiz();
  else { document.getElementById('soundFilter').value=''; renderVerbs(); }
}

// ── INIT ──────────────────────────────────────────────────────────────────
renderVerbs();
</script>
